name: Bug report
description: Something on the site, in a post, or in the safety stack is doing the wrong thing.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. The experiment is built by AI agents under
        human approval, so concrete, reproducible reports are especially
        useful.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what you observed.
      placeholder: "On /log the rejection reasons render twice when…"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "Each rejection should render once."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Step-by-step. Screenshots and URLs welcome.
      placeholder: |
        1. Open https://themilliondollaraiexperiment.com/log
        2. Click "Show rejected only"
        3. Observe …
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser / device (if relevant)
      placeholder: "Chrome 134 on Windows 11"
    validations:
      required: false
