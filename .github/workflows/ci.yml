name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        # Build needs SOME env vars present so module-level reads do not throw
        # at import time. These are stubs — CI does not make live API calls.
        run: npm run build
        env:
          OPENAI_API_KEY: sk-stub-for-ci
          NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub
          SUPABASE_SERVICE_ROLE_KEY: stub
          X_APP_KEY: stub
          X_APP_SECRET: stub
          X_ACCESS_TOKEN: stub
          X_ACCESS_SECRET: stub
          CRON_SECRET: stub
          ADMIN_TOKEN: stub
          NEXT_PUBLIC_X_PROFILE_URL: https://x.com/MDAIExperiment
